<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>외국어공부</title><meta name="theme-color" content="#3563e9">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%233563e9'/%3E%3Ctext x='50' y='68' font-size='56' text-anchor='middle' fill='white'%3E外%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#1c2333;--muted:#6a7489;--pri:#3563e9;--pri-soft:#e8eefd;--ok:#15803d;--ok-soft:#dcfce7;--bad:#b91c1c;--bad-soft:#fee2e2;--warn:#b45309;--warn-soft:#fef3c7;--line:#e2e7f0;--rest:#eef0f5}
body.dark{--bg:#0e1320;--card:#171e30;--ink:#e8ecf6;--muted:#97a3bb;--pri:#7b9cff;--pri-soft:#212c4a;--ok:#4ade80;--ok-soft:#14301f;--bad:#f87171;--bad-soft:#3a1a1d;--warn:#fbbf24;--warn-soft:#3a2d12;--line:#27314b;--rest:#1d2438}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Hiragino Sans","PingFang SC",system-ui,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 96px}
h1{font-size:22px;margin:0 0 4px}h2{font-size:18px;margin:22px 0 10px}h3{font-size:16px;margin:0 0 6px}
p{margin:6px 0}a{color:var(--pri);text-decoration:none}
.muted{color:var(--muted)}.small{font-size:13px}.center{text-align:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
.card.pri{border-color:var(--pri);background:var(--pri-soft)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.grid2{grid-template-columns:1fr}}
.btn{display:inline-block;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 16px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer;text-align:center}
.btn:hover{border-color:var(--pri)}.btn.primary{background:var(--pri);color:#fff;border-color:var(--pri)}
.btn.danger{color:var(--bad);border-color:var(--bad)}.btn.small{padding:6px 12px;font-size:14px}.btn[disabled]{opacity:.5;cursor:default}
.btn.block{display:block;width:100%}
.link{background:none;border:0;color:var(--muted);cursor:pointer;font:inherit;text-decoration:underline}
.chip{display:inline-block;background:var(--pri-soft);color:var(--pri);border-radius:99px;padding:2px 10px;font-size:13px;font-weight:600}
.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.warn{background:var(--warn-soft);color:var(--warn)}.chip.bad{background:var(--bad-soft);color:var(--bad)}
.hero{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:6px}
.xp{background:var(--pri-soft);color:var(--pri);border-radius:12px;padding:6px 12px;font-weight:700;white-space:nowrap}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 14px;margin:10px 0;font-weight:600}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);z-index:5;padding-bottom:env(safe-area-inset-bottom)}
.nav a{flex:1;text-align:center;padding:10px 2px;font-size:12px;color:var(--muted);font-weight:600}.nav a b{display:block;font-size:18px;line-height:1.2}.nav a.on{color:var(--pri)}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pri);border-radius:99px}.bar.ok i{background:var(--ok)}
.sess-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}
.q .big{font-size:30px;font-weight:700;text-align:center;margin:18px 0;line-height:1.5;word-break:keep-all}
.q .sent{font-size:20px;text-align:center;margin:14px 0;font-weight:600}
.q .rd{font-size:14px;color:var(--muted);text-align:center;margin-top:-6px}
.q .hg{display:block;font-size:14px;color:var(--muted);font-weight:500}
.ctx{background:var(--bg);border-radius:10px;padding:12px;margin:10px 0;font-size:17px;line-height:1.9}
.opts{display:grid;gap:10px;margin-top:14px}
.opt{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:13px 14px;font:inherit;font-size:17px;text-align:left;cursor:pointer}
.opt:hover{border-color:var(--pri)}.opt.ok{border-color:var(--ok);background:var(--ok-soft)}.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
input[type=text],input[type=password],input[type=time],input[type=number],textarea,select{width:100%;font:inherit;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
textarea{min-height:140px;resize:vertical}
.fb{margin-top:14px;padding:12px;border-radius:10px;font-weight:600}.fb.ok{background:var(--ok-soft);color:var(--ok)}.fb.bad{background:var(--bad-soft);color:var(--bad)}
.fb small{display:block;font-weight:400;color:var(--ink);margin-top:4px}
ruby rt{font-size:.5em;color:var(--muted);font-weight:500}
.score-row{display:grid;grid-template-columns:64px 1fr 44px;gap:10px;align-items:center;margin:8px 0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal .h{text-align:center;font-size:12px;color:var(--muted);padding:4px 0}
.cal .d{min-height:54px;border-radius:8px;padding:4px;font-size:12px;background:var(--card);border:1px solid var(--line);position:relative}
.cal .d.rest{background:var(--rest);color:var(--muted)}.cal .d.done{background:var(--ok-soft);border-color:var(--ok)}
.cal .d.credited{background:var(--pri-soft);border-color:var(--pri)}.cal .d.extra{background:var(--pri-soft);border-color:var(--pri)}
.cal .d.missed{background:var(--bad-soft);border-color:var(--bad)}.cal .d.pending{border:2px solid var(--warn)}
.cal .d.today b{text-decoration:underline}.cal .d .t{display:block;margin-top:2px;font-weight:600}.cal .d .a{position:absolute;right:5px;top:4px;color:var(--pri)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:center}th{color:var(--muted);font-weight:600}td:first-child,th:first-child{text-align:left}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.tabs .btn.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.badge{border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center;font-size:13px;background:var(--card)}.badge b{display:block;font-size:26px}.badge.off{opacity:.4;filter:grayscale(1)}
.switch{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);gap:10px}.switch:last-child{border:0}
.switch input[type=checkbox]{width:22px;height:22px}
pre{white-space:pre-wrap;word-break:break-word;background:var(--bg);padding:12px;border-radius:10px;font:14px/1.6 inherit}
#toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#1c2333;color:#fff;padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:20;max-width:90vw;font-size:14px}
#toast.on{opacity:.95}
.lock{max-width:360px;margin:12vh auto 0}
details summary{cursor:pointer;color:var(--pri);font-weight:600}
</style></head><body><div id="app"></div><div id="toast"></div><script>(function(){"use strict";
/* 외국어공부 - 내장 학습 콘텐츠 (영어·일본어·중국어)
 * 구조: WL_CONTENT[언어][레벨 0~3][유닛] = {t, w:[단어...], p:{지문}}
 * 단어: {w 단어, r 읽기(후리가나/병음), h 한글발음, k 뜻, e 예문, er 예문 읽기, ek 예문 뜻}
 * 지문: {t 본문, r 읽기(선택), k 번역, q 질문, o 보기(정답이 첫 번째)}
 */
const E = (w, k, e, ek) => ({ w, r: "", h: "", k, e, er: "", ek });
const X = (w, r, h, k, e, er, ek) => ({ w, r, h, k, e, er, ek });
const P = (t, k, q, o, r) => ({ t, k, q, o, r: r || "" });
const U = (t, w, p) => ({ t, w, p });

const WL_CONTENT = {
  en: [
    [
      U("인사와 소개", [
        E("hello", "안녕하세요", "Hello, my name is Tom.", "안녕하세요, 제 이름은 톰입니다."),
        E("goodbye", "안녕히 가세요", "Goodbye, see you tomorrow.", "안녕히 가세요, 내일 만나요."),
        E("thank you", "감사합니다", "Thank you for your help.", "도와주셔서 감사합니다."),
        E("please", "부탁합니다", "Please sit down.", "앉아 주세요."),
        E("sorry", "미안합니다", "I am sorry I am late.", "늦어서 미안합니다.")
      ], P("Hi, I am Mina. I am a student. I like music.", "안녕, 나는 미나야. 나는 학생이야. 나는 음악을 좋아해.", "미나는 누구인가요?", ["학생", "선생님", "의사"])),
      U("음식", [
        E("apple", "사과", "I eat an apple every day.", "나는 매일 사과를 먹는다."),
        E("water", "물", "Can I have some water?", "물 좀 주시겠어요?"),
        E("bread", "빵", "She buys bread at the store.", "그녀는 가게에서 빵을 산다."),
        E("milk", "우유", "I drink milk in the morning.", "나는 아침에 우유를 마신다."),
        E("rice", "밥", "We have rice for dinner.", "우리는 저녁으로 밥을 먹는다.")
      ], P("I have breakfast at seven. I eat bread and drink milk.", "나는 7시에 아침을 먹는다. 빵을 먹고 우유를 마신다.", "아침에 무엇을 마시나요?", ["우유", "물", "주스"])),
      U("가족", [
        E("mother", "어머니", "My mother is a teacher.", "우리 어머니는 선생님이다."),
        E("father", "아버지", "My father works at a bank.", "우리 아버지는 은행에서 일한다."),
        E("brother", "남자 형제", "My brother plays soccer.", "내 남자 형제는 축구를 한다."),
        E("sister", "여자 형제", "My sister likes books.", "내 여자 형제는 책을 좋아한다."),
        E("friend", "친구", "He is my good friend.", "그는 나의 좋은 친구다.")
      ], P("This is my family. I have a mother, a father, and one sister. We live in Seoul.", "이것은 우리 가족이다. 어머니, 아버지, 여동생 한 명이 있다. 우리는 서울에 산다.", "가족은 어디에 사나요?", ["서울", "부산", "도쿄"]))
    ],
    [
      U("일상", [
        E("wake up", "일어나다", "I wake up at six every morning.", "나는 매일 아침 6시에 일어난다."),
        E("breakfast", "아침 식사", "We have breakfast together.", "우리는 함께 아침을 먹는다."),
        E("school", "학교", "She walks to school.", "그녀는 걸어서 학교에 간다."),
        E("homework", "숙제", "I finish my homework before dinner.", "나는 저녁 전에 숙제를 끝낸다."),
        E("sleep", "자다", "I sleep for eight hours.", "나는 8시간 잔다.")
      ], P("Tom wakes up at six. He walks to school with his friend. After school, he does his homework.", "톰은 6시에 일어난다. 그는 친구와 걸어서 학교에 간다. 방과 후에 숙제를 한다.", "톰은 학교에 어떻게 가나요?", ["걸어서", "버스로", "자전거로"])),
      U("쇼핑", [
        E("price", "가격", "What is the price of this shirt?", "이 셔츠의 가격은 얼마인가요?"),
        E("cheap", "싼", "This bag is very cheap.", "이 가방은 매우 싸다."),
        E("expensive", "비싼", "That watch is too expensive.", "저 시계는 너무 비싸다."),
        E("buy", "사다", "I want to buy new shoes.", "나는 새 신발을 사고 싶다."),
        E("size", "크기", "Do you have a bigger size?", "더 큰 사이즈가 있나요?")
      ], P("Anna goes to a shop. She likes a red bag, but it is expensive. She buys a blue bag because it is cheap.", "안나는 가게에 간다. 빨간 가방이 마음에 들지만 비싸다. 파란 가방은 싸서 그것을 산다.", "안나는 왜 파란 가방을 샀나요?", ["싸서", "예뻐서", "커서"])),
      U("날씨", [
        E("sunny", "맑은", "It is sunny today.", "오늘은 날씨가 맑다."),
        E("rainy", "비가 오는", "Tomorrow will be rainy.", "내일은 비가 올 것이다."),
        E("cold", "추운", "It is cold in winter.", "겨울에는 춥다."),
        E("hot", "더운", "Summer is hot in Korea.", "한국의 여름은 덥다."),
        E("umbrella", "우산", "Take an umbrella with you.", "우산을 가지고 가세요.")
      ], P("It is rainy today. Jenny takes an umbrella. The weather is cold, so she wears a coat.", "오늘은 비가 온다. 제니는 우산을 가져간다. 날씨가 추워서 코트를 입는다.", "제니는 무엇을 가져갔나요?", ["우산", "모자", "책"]))
    ],
    [
      U("여행", [
        E("reservation", "예약", "I made a hotel reservation online.", "나는 온라인으로 호텔 예약을 했다."),
        E("passport", "여권", "Do not forget your passport.", "여권을 잊지 마세요."),
        E("luggage", "짐", "My luggage is very heavy.", "내 짐은 매우 무겁다."),
        E("destination", "목적지", "Our final destination is Busan.", "우리의 최종 목적지는 부산이다."),
        E("delay", "지연", "The flight has a two-hour delay.", "비행기가 2시간 지연되었다.")
      ], P("Our flight had a long delay, so we arrived at the hotel late. Fortunately, the reservation was still available.", "비행기가 오래 지연되어 우리는 호텔에 늦게 도착했다. 다행히 예약은 그대로 남아 있었다.", "호텔에 늦게 도착한 이유는 무엇인가요?", ["비행기 지연", "교통 체증", "길을 잃어서"])),
      U("직장", [
        E("meeting", "회의", "We have a meeting at ten.", "우리는 10시에 회의가 있다."),
        E("deadline", "마감일", "The deadline is next Friday.", "마감일은 다음 주 금요일이다."),
        E("colleague", "동료", "My colleague helped me with the report.", "동료가 보고서를 도와주었다."),
        E("schedule", "일정", "Please check the schedule again.", "일정을 다시 확인해 주세요."),
        E("improve", "개선하다", "We need to improve our service.", "우리는 서비스를 개선해야 한다.")
      ], P("Our team has a meeting every Monday. We discuss the schedule and try to improve our work before the deadline.", "우리 팀은 매주 월요일에 회의를 한다. 일정을 논의하고 마감일 전에 업무를 개선하려고 한다.", "팀은 월요일마다 무엇을 하나요?", ["회의", "여행", "시험"])),
      U("건강", [
        E("exercise", "운동", "Regular exercise keeps you healthy.", "규칙적인 운동은 건강을 지켜 준다."),
        E("headache", "두통", "I have a bad headache.", "나는 두통이 심하다."),
        E("medicine", "약", "Take this medicine after meals.", "이 약을 식후에 드세요."),
        E("habit", "습관", "Sleeping early is a good habit.", "일찍 자는 것은 좋은 습관이다."),
        E("recover", "회복하다", "He will recover quickly from the flu.", "그는 독감에서 빨리 회복할 것이다.")
      ], P("Sam had a headache for two days. He took medicine and rested. Now he is recovering and plans to start exercise again.", "샘은 이틀 동안 두통이 있었다. 약을 먹고 쉬었다. 지금은 회복 중이며 다시 운동을 시작할 계획이다.", "샘은 지금 어떤 상태인가요?", ["회복 중이다", "더 나빠졌다", "입원했다"]))
    ],
    [
      U("사회와 환경", [
        E("sustainable", "지속 가능한", "We need sustainable energy sources.", "우리는 지속 가능한 에너지원이 필요하다."),
        E("pollution", "오염", "Air pollution affects our health.", "대기 오염은 우리 건강에 영향을 준다."),
        E("regulation", "규제", "New regulations protect the environment.", "새로운 규제가 환경을 보호한다."),
        E("consume", "소비하다", "People consume more than they need.", "사람들은 필요 이상으로 소비한다."),
        E("urgent", "시급한", "Climate change is an urgent problem.", "기후 변화는 시급한 문제다.")
      ], P("Governments are introducing stricter regulations to reduce pollution. However, experts argue that individuals must also change how they consume resources.", "정부는 오염을 줄이기 위해 더 엄격한 규제를 도입하고 있다. 그러나 전문가들은 개인도 자원을 소비하는 방식을 바꿔야 한다고 주장한다.", "전문가들의 주장은 무엇인가요?", ["개인도 소비 방식을 바꿔야 한다", "정부만 노력하면 된다", "오염은 줄지 않는다"])),
      U("경제", [
        E("inflation", "물가 상승", "Inflation has increased living costs.", "물가 상승으로 생활비가 늘었다."),
        E("investment", "투자", "Education is a good investment.", "교육은 좋은 투자다."),
        E("budget", "예산", "We must stay within the budget.", "우리는 예산 안에서 지출해야 한다."),
        E("profit", "이익", "The company made a large profit.", "그 회사는 큰 이익을 냈다."),
        E("competitive", "경쟁력 있는", "Their prices are very competitive.", "그들의 가격은 매우 경쟁력이 있다.")
      ], P("Although the company's profit rose, inflation raised costs. The manager decided to cut the budget and focus on competitive products.", "회사의 이익은 늘었지만 물가 상승으로 비용이 올랐다. 관리자는 예산을 줄이고 경쟁력 있는 제품에 집중하기로 했다.", "관리자는 무엇을 결정했나요?", ["예산을 줄이고 경쟁력 있는 제품에 집중", "직원을 늘리기", "가격을 올리기"])),
      U("학문과 의견", [
        E("argument", "주장", "Her argument was very convincing.", "그녀의 주장은 매우 설득력이 있었다."),

  } catch (e) { out.innerHTML = '<p class="fb bad">' + esc(e.message || "오류가 발생했어요") + "</p>"; }
}

/* ===== 라우터 ===== */
function render() {
  cache = {}; document.body.classList.toggle("dark", !!S.settings.dark);
  let out;
  if (!S.profile) out = viewSetup();
  else if (sessionStorage.getItem("wl_ok") !== "1") out = viewLogin();
  else {
    const p = (location.hash || "#/home").replace(/^#\//, "").split("/");
    switch (p[0]) {
      case "start": out = viewStart(p[1]); break;
      case "session": out = viewSession(); break;
      case "result": out = viewResult(); break;
      case "stats": out = viewStats(); break;
      case "grades": out = viewGrades(); break;
      case "review": out = viewReview(); break;
      case "rewards": out = viewRewards(); break;
      case "settings": out = viewSettings(); break;
      case "ai": out = viewAi(); break;
      default: out = viewHome();
    }
  }
  if (!out) return;

  if (sess && (location.hash === "#/session")) {
    const q = curQ();
    if (q && q.autoplay && !sess.fb && q.audio && !sess.played) { sess.played = sess.i + "|" + q.audio.text; speak(q.audio.text, q.audio.lang); }
    if (q && q.type === "text" && !sess.fb) { const a = $("#ans"); if (a) a.focus(); }
  }
}

/* ===== 이벤트 ===== */
function recStart() {
  const q = curQ(); if (!SR || sess.fb || sess.rec) return; const r = new SR(); r.lang = L[q.lang].stt; r.maxAlternatives = 3; r.interimResults = false; sess.rec = true; let got = false; render();
  r.onresult = e => { got = true; const alts = Array.from(e.results[0]).map(a => a.transcript), score = Math.max.apply(null, alts.map(a => simScore(a, [q.target].concat(q.alt)))); sess.rec = false; sess.fb = { ok: score >= 60, score, heard: alts[0] }; recordAnswer(q, score >= 60, score); render(); };
  r.onerror = e => { if (got) return; sess.rec = false; toast("음성을 인식하지 못했어요(" + (e.error || "오류") + "). 다시 시도하거나 건너뛰세요."); render(); };
  r.onend = () => { if (!got && sess && sess.rec) { sess.rec = false; render(); } };
  try { r.start(); } catch (err) { sess.rec = false; toast("마이크를 시작할 수 없어요."); render(); }
}
function answerSpeak(score) { const q = curQ(); sess.fb = { ok: score >= 60, score }; recordAnswer(q, score >= 60, score); render(); }
function nextQ() { sess.i++; sess.fb = null; sess.flip = false; sess.tr = false; sess.rec = false; sess.played = ""; render(); }
function validPack(o) {
  if (!o || !L[o.lang] || !(o.level >= 0 && o.level <= 3) || !Array.isArray(o.units) || !o.units.length) return false;
  return o.units.every(u => u && u.t && Array.isArray(u.w) && u.w.length >= 4 && u.w.every(w => w && w.w && w.k && w.e && w.ek) && (!u.p || (u.p.t && u.p.k && u.p.q && Array.isArray(u.p.o) && u.p.o.length >= 2)));
}
function exportData() {
  const copy = JSON.parse(JSON.stringify(S)); copy.settings.apiKey = "";
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify(copy)], { type: "application/json" })); a.download = "외국어공부-백업-" + today() + ".json"; document.body.appendChild(a); a.click(); a.remove();
}
document.addEventListener("click", e => {
  const say = e.target.closest("[data-say]"); if (say) { speak(say.dataset.say, say.dataset.lang); return; }
  const t = e.target.closest("[data-act]"); if (!t) return; const act = t.dataset.act, lang = t.dataset.lang;
  switch (act) {
    case "setup": { const name = $("#name").value.trim(), p1 = $("#pin").value, p2 = $("#pin2").value; if (!name) return toast("이름을 입력해 주세요."); if (!/^\d{4}$/.test(p1)) return toast("PIN은 숫자 4자리예요."); if (p1 !== p2) return toast("PIN이 서로 달라요."); S.profile = { name, pin: hashPin(name, p1) }; sessionStorage.setItem("wl_ok", "1"); markAttend(); checkBadges(); save(); go("#/home"); break; }
    case "login": { const p = $("#pin").value; if (hashPin(S.profile.name, p) !== S.profile.pin) { toast("PIN이 맞지 않아요."); return; } sessionStorage.setItem("wl_ok", "1"); markAttend(); checkBadges(); save(); go("#/home"); break; }
    case "forgot": if (confirm("PIN을 잊으면 데이터를 초기화해야 해요. 백업 파일이 있다면 초기화 후 불러오기로 복원할 수 있어요. 초기화할까요?")) { localStorage.removeItem(KEY); S = loadState(); sessionStorage.removeItem("wl_ok"); render(); } break;
    case "placeStart": { const lvl = +t.dataset.lvl; if (!confirm(L[lang].name + " · " + LV[lvl] + " 레벨 테스트를 시작할까요? (21문항, 약 15~20분)")) return; startSession("placement", lang, buildTest(lang, lvl), { lvl, title: L[lang].name + " 레벨 테스트" }); break; }
    case "monthly": { const st = S.langs[lang]; if (!confirm(L[lang].name + " 월간 승급 테스트를 시작할까요? 이번 달에는 한 번만 응시할 수 있어요.")) return; startSession("monthly", lang, buildTest(lang, st.level), { lvl: st.level, title: L[lang].name + " 승급 테스트" }); break; }
    case "study": { const d = buildDaily(lang); startSession("daily", lang, d.qs, { title: L[lang].name + " · " + d.unitName }); break; }
    case "reviewStart": { const qs = dueReviews(lang).slice(0, 15).map(k => qFromRef(lang, S.review[k].ref)).filter(Boolean); if (!qs.length) return toast("지금 복습할 문제가 없어요."); startSession("review", lang, qs, { title: L[lang].name + " 복습" }); break; }

    case "delHol": { const k = t.dataset.k; if (S.settings.hAdd.indexOf(k) >= 0) S.settings.hAdd = S.settings.hAdd.filter(x => x !== k); else S.settings.hDel.push(k); save(); render(); break; }
    case "chgPin": { const o = $("#oldPin").value, n = $("#newPin").value; if (hashPin(S.profile.name, o) !== S.profile.pin) return toast("현재 PIN이 맞지 않아요."); if (!/^\d{4}$/.test(n)) return toast("새 PIN은 숫자 4자리예요."); S.profile.pin = hashPin(S.profile.name, n); save(); toast("PIN을 변경했어요."); render(); break; }
    case "export": exportData(); break;
    case "import": $("#impFile").click(); break;
    case "reset": if (confirm("모든 기록이 삭제돼요. 정말 초기화할까요?") && confirm("되돌릴 수 없어요. 먼저 내보내기를 하셨나요? 그래도 초기화할까요?")) { localStorage.removeItem(KEY); sessionStorage.removeItem("wl_ok"); S = loadState(); location.hash = "#/home"; render(); } break;
    case "packImport": { try { const o = JSON.parse($("#packText").value), list = Array.isArray(o) ? o : [o]; if (!list.length || !list.every(validPack)) throw new Error("형식 오류"); list.forEach(p => S.packs.push(p)); save(); toast("콘텐츠 " + list.reduce((a, p) => a + p.units.length, 0) + "개 유닛을 추가했어요."); render(); } catch (err) { toast("JSON 형식을 확인해 주세요. (단어 4개 이상, w·k·e·ek 필수)"); } break; }
    case "aiRun": aiRun(); break;
  }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "impFile" && t.files && t.files[0]) {
    const f = t.files[0], rd = new FileReader();
    rd.onload = () => { try { const o = JSON.parse(rd.result); if (!o || !o.profile || !o.v) throw new Error("x"); if (!confirm("현재 기록을 이 백업으로 바꿉니다. 계속할까요?")) return; const d = defaultState(); S = Object.assign(d, o, { settings: Object.assign(d.settings, o.settings || {}, { apiKey: S.settings.apiKey }) }); save(); sessionStorage.removeItem("wl_ok"); toast("불러왔어요. PIN을 다시 입력해 주세요."); render(); } catch (err) { toast("백업 파일을 읽을 수 없어요."); } };

  save(); if (k === "dark" || k === "furigana" || k === "pinyin" || k === "hangul") render();
});
document.addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  if (e.target.id === "ans") { const b = $('[data-act="submit"]'); if (b) b.click(); else { const n = $('[data-act="next"]'); if (n) n.click(); } }
  else if (e.target.id === "pin" && S.profile && sessionStorage.getItem("wl_ok") !== "1") { const b = $('[data-act="login"]'); if (b) b.click(); }
});
window.addEventListener("hashchange", render);

/* ===== 알림 ===== */
function notifyTick() {
  if (!S.settings.notify || !("Notification" in window) || Notification.permission !== "granted" || !S.profile || sessionStorage.getItem("wl_ok") !== "1") return;
  const now = new Date(), hm = pad(now.getHours()) + ":" + pad(now.getMinutes()), t = today();

}

/* ===== 시작 ===== */
if (S.profile && sessionStorage.getItem("wl_ok") === "1") { markAttend(); }
window.__WL = { get S() { return S; }, get sess() { return sess; }, render, buildTest, buildDaily, startSession, finish, status, rangeStats, streak, credits, simScore, checkText, decidePlacement, decideMonthly, wordsOf, levelUnits, recStart, nextQ };
